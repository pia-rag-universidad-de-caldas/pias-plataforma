[project]
name = "ingesta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sga-encoder", email = "sebastian.garzon54795@ucaldas.edu.co" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.130.0",
    "httpx>=0.28.1",
    "instructor>=1.17.0",
    "litellm>=1.102.1",
    "neo4j>=6.3.1",
    "prefect>=3.8.6",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
ingesta = "ingesta:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
