name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      # Without the `chunk` extra (Docling and PyTorch, about 6 GB): what needs it is skipped.
      - name: Install
        run: uv sync --locked --extra data
      - name: Format
        run: uv run --no-sync ruff format --check src tests
      - name: Lint
        run: uv run --no-sync ruff check
      - name: Types
        run: uv run --no-sync mypy
      - name: Tests and coverage
        run: uv run --no-sync pytest --cov

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      # With every extra: Docling isn't installed here, but what it brings is what reads the documents.
      - name: Export the locked dependencies
        run: uv export --locked --quiet --no-hashes --no-emit-project --extra data --extra chunk --extra embed --output-file requirements.txt
      - name: Known vulnerabilities
        run: uvx pip-audit==2.10.1 --requirement requirements.txt --no-deps --disable-pip
