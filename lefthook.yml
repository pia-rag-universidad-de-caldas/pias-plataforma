pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,js,mjs,json,md,astro,yaml,yml,css}"
      exclude:
        - "**/CLAUDE.md"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    ruff:
      glob: "*.py"
      run: uvx ruff check --fix {staged_files} && uvx ruff format {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
