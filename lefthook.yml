pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,js,mjs,json,md,astro,yaml,yml,css}"
      exclude:
        - "**/CLAUDE.md"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    ruff:
      glob: "*.py"
      run: uvx ruff check --fix {staged_files} && uvx ruff format {staged_files}
      stage_fixed: true

pre-push:
  commands:
    convenciones:
      # Informativo (no bloquea) mientras dure la fase de avisos, igual que en CI.
      run: pnpm convenciones:revisar --cambios || true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
